<div class="p-3">
  <div class="card">
    <div class="card-header">Products</div>
    <div class="card-body">
      <table class="table">
        <thead>
        <tr><th>ID</th><th>Name</th><th>Price</th><th>Quantity</th></tr>
        </thead>
        <tbody>
        @for (product of products; track product.id) {
        <tr>
          <td>{{product.id}}</td>
          <td>{{product.name}}</td>
          <td>{{product.price}}</td>
          <td>{{product.quantity}}</td>
        </tr>
        }
        </tbody>
      </table>
    </div>
  </div>
</div>
